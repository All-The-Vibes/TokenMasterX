  <text x="900" y="294" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="36" font-weight="800" fill="#10B981" letter-spacing="-1.2">88 / 88</text>
