<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="TokenMaster — Half the tokens. Half the cold-start cost. Zero prompt-cache invalidation on the real GitHub Copilot CLI.">
  <!-- Background & 1px Swiss Frame -->
  <rect width="1200" height="360" rx="8" fill="#0B0C0E"/>
  <rect x="0.5" y="0.5" width="1199" height="359" rx="7.5" fill="none" stroke="#23262D" stroke-width="1"/>

  <!-- Top Editorial Meta Bar -->
