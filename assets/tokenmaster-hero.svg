    <text x="0" y="102" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#10B981">WITH TOKENMASTER</text>
    <text x="440" y="102" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#10B981">1,237,510 tok · $5.21 cold (−49.5%)</text>
    <rect x="0" y="110" width="440" height="22" rx="3" fill="#14181F" stroke="#232832" stroke-width="1"/>
    <rect x="0" y="110" width="222" height="22" rx="3" fill="#064E3B" stroke="#10B981" stroke-width="1.2"/>
