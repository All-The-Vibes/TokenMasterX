  <line x1="324" y1="246" x2="324" y2="342" stroke="#23262D" stroke-width="1"/>
  <line x1="600" y1="246" x2="600" y2="342" stroke="#23262D" stroke-width="1"/>
  <line x1="876" y1="246" x2="876" y2="342" stroke="#23262D" stroke-width="1"/>

  <!-- Cell 1 -->
  <text x="52" y="294" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="36" font-weight="800" fill="#F4F1EA" letter-spacing="-1.2">−53.4%</text>
