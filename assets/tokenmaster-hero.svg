  <text x="624" y="294" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="36" font-weight="800" fill="#F4F1EA" letter-spacing="-1.2">−49.5%</text>
