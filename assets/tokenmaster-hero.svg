  <text x="1144" y="35" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#68707C" letter-spacing="1.0">LEAN TOOLS · GRAPH NAVIGATION · CACHE-SAFE SHAPING · /TOKENOMICS</text>
  <line x1="48" y1="54" x2="1152" y2="54" stroke="#23262D" stroke-width="1"/>

  <!-- Center Vertical Divider -->
  <line x1="668" y1="54" x2="668" y2="246" stroke="#23262D" stroke-width="1"/>

  <!-- LEFT: Wordmark & Statement -->
  <text x="48" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="72" font-weight="800" fill="#F4F1EA" letter-spacing="-2.8">TokenMaster</text>
  <text x="52" y="178" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="500" fill="#D0D5DD">Half the tokens. Half the cold-start cost.</text>
  <text x="52" y="205" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="500" fill="#8A919E">Zero prompt-cache invalidation on the real Copilot CLI.</text>

  <!-- RIGHT: Clean Before / After Comparison -->
  <g transform="translate(704, 82)">
    <text x="0" y="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#68707C" letter-spacing="1.2">MEASURED ON REAL GITHUB COPILOT CLI (29 TASKS · GPT-6 ASTRA)</text>

